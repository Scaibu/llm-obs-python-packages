name: Sync Submodules to Main

on:
  schedule:
    # Run once every 2 days at midnight UTC to conserve GitHub Actions minutes
    - cron: '0 0 */2 * *'
  workflow_dispatch:
  repository_dispatch:
    types: [submodule-update]

permissions:
  contents: write

jobs:
  sync:
    name: Sync Submodules
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN || github.token }}
          submodules: true
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Update submodules to main branch
        run: |
          # Fetch and merge latest main for each submodule
          git submodule update --remote --merge

          # Check if any submodule changed
          if git diff --quiet; then
            echo "All submodules are already up to date with their main branch."
          else
            echo "Submodules updated. Committing and pushing changes..."
            git add .gitmodules
            git submodule foreach 'git rev-parse HEAD'
            git commit -am "chore(submodules): auto-sync submodules to latest main [skip ci]"
            git push origin main
          fi
